<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 100 100" role="img" aria-labelledby="title desc">
  <title id="title">SnipLingo desktop icon</title>
  <desc id="desc">A rounded indigo tile with selection corners and a pair of white and mint translation arrows.</desc>
  <defs>
