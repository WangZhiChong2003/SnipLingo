  <g transform="translate(2 1) scale(.96)">
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M18 37V27a9 9 0 0 1 9-9h10m45 45v10a9 9 0 0 1-9 9H63" stroke="#B7C7FF" stroke-width="5.5"/>
      <path d="M31 39h40M60 28l11 11-11 11" stroke="#FFFFFF" stroke-width="8.5"/>
