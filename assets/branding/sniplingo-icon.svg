      <stop stop-color="#687AF5"/>
      <stop offset=".49" stop-color="#4B59D5"/>
      <stop offset="1" stop-color="#303C9D"/>
    </linearGradient>
    <linearGradient id="rim" x2="56%" y2="100%">
      <stop stop-color="#BFC9FF" stop-opacity=".72"/>
      <stop offset=".58" stop-color="#8898FF" stop-opacity=".2"/>
      <stop offset="1" stop-color="#B1BCFF" stop-opacity=".34"/>
    </linearGradient>
    <clipPath id="face">
      <rect x="5.5" y="4.5" width="89" height="89" rx="22"/>
