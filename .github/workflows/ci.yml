name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test (Ubuntu 22.04 / Qt 6.2)
    runs-on: ubuntu-22.04
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config dbus-daemon xvfb xauth xclip \
            qt6-base-dev qt6-declarative-dev qt6-tools-dev qt6-tools-dev-tools qt6-l10n-tools \
            qt6-wayland libgl-dev libqt6opengl6-dev libqt6svg6 \
            qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-layouts \
            qml6-module-qtquick-templates qml6-module-qtquick-window \
            qml6-module-qtqml-workerscript \
            libatspi2.0-dev libglib2.0-dev libdbus-1-dev libxcb1-dev \
            libxcb-xfixes0-dev libxcb-xinput-dev libxcb-xtest0-dev

      - name: Report toolchain versions
        run: cmake --version && ninja --version && qmake6 -query QT_VERSION

      - name: Configure
        run: |
          set -o pipefail
          cmake --preset ci -DCMAKE_BUILD_TYPE=RelWithDebInfo 2>&1 | tee configure.log

      - name: Build
        run: |
          build_jobs=$(( $(nproc) - 2 ))
          if [ "$build_jobs" -lt 1 ]; then build_jobs=1; fi
          cmake --build --preset ci --parallel "$build_jobs"

      - name: Test
        run: |
          test "$(build/ci/sniplyngo --version)" = "sniplyngo $(cat VERSION)"
          xvfb-run -a sh -c 'SNIPLYNGO_X11_TEST_DISPLAY="$DISPLAY" ctest --preset ci --output-on-failure'

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-ubuntu-qt
          path: |
            build/ci/Testing/Temporary/LastTest.log
            configure.log
          if-no-files-found: ignore
          retention-days: 7

  format:
    name: Code style
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-format-18

      - name: Check formatting of tracked C++ sources
        run: |
          mapfile -t files < <(git ls-files '*.cpp' '*.h' '*.hpp')
          clang-format-18 --version
          clang-format-18 --dry-run --Werror "${files[@]}"

  docs:
    name: Documentation sanity
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Verify required community files exist
        run: |
          set -eu
          missing=0
          for f in README.md README.zh-CN.md LICENSE CONTRIBUTING.md CODE_OF_CONDUCT.md \
                   SECURITY.md CHANGELOG.md docs/architecture.md docs/engines.md docs/engines.zh-CN.md \
                   docs/linux-integration.md docs/linux-integration.zh-CN.md; do
            if [ ! -s "$f" ]; then
              echo "::error file=$f::Required file is missing or empty"
              missing=1
            fi
          done
          exit "$missing"

      - name: Check for broken relative markdown links
        run: |
          python3 - <<'PY'
          import pathlib, re, sys

          root = pathlib.Path(".")
          link = re.compile(r"\[[^\]]*\]\(([^)\s]+)\)")
          broken = []
          for md in list(root.glob("*.md")) + list(root.glob("docs/**/*.md")) + list(root.glob(".github/**/*.md")):
              text = md.read_text(encoding="utf-8")
              for target in link.findall(text):
                  if target.startswith(("http://", "https://", "mailto:", "#")):
                      continue
                  path = target.split("#", 1)[0]
                  if not path:
                      continue
                  resolved = (md.parent / path).resolve()
                  if not resolved.exists():
                      broken.append(f"{md}: {target}")
          for entry in broken:
              print(f"::error::Broken link {entry}")
          sys.exit(1 if broken else 0)
          PY
